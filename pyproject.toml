[project]
name = "netmask-validator"
version = "0.1.0"
description = "Validate that an address and prefix length form a legal network and identify host bits set in the address."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
